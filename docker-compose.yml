version: '3.8'

services:
  minter-api:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - minter-data:/app/data
    env_file:
      - .env
    environment:
      # Override for Docker (SQLite in volume)
      - DATABASE_URL=sqlite:////app/data/minter.db
    restart: unless-stopped

  minter-worker:
    build: .
    command: ["python", "-m", "app.main_worker"]
    volumes:
      - minter-data:/app/data
    env_file:
      - .env
    environment:
      # Override for Docker (SQLite in shared volume)
      - DATABASE_URL=sqlite:////app/data/minter.db
    restart: unless-stopped

  # Uncomment for PostgreSQL in production
  # postgres:
