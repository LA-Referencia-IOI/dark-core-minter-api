x-minter-build: &minter-build
  context: ../..
  dockerfile: services/dark-core-minter-api/Dockerfile

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dark
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dark_password}
      POSTGRES_DB: minter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dark -d minter"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - minter-net

  minter-api:
    build: *minter-build
    ports:
      - "8001:8001"
    volumes:
      - metadata-storage:/app/metadata_storage
    env_file:
      - .env.integration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://dark:${DB_PASSWORD:-dark_password}@postgres:5432/minter
    restart: unless-stopped
    networks:
      - minter-net
      - dark-net

  minter-metadata-worker:
    build: *minter-build
    command: ["metadata-worker"]
    volumes:
      - metadata-storage:/app/metadata_storage
    env_file:
      - .env.integration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://dark:${DB_PASSWORD:-dark_password}@postgres:5432/minter
    restart: unless-stopped
    networks:
      - minter-net
      - dark-net

  minter-chain-worker:
    build: *minter-build
    command: ["chain-worker"]
    volumes:
      - metadata-storage:/app/metadata_storage
    env_file:
      - .env.integration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://dark:${DB_PASSWORD:-dark_password}@postgres:5432/minter
    restart: unless-stopped
    networks:
      - minter-net
      - dark-net

volumes:
  postgres-data:
  metadata-storage:

networks:
  minter-net:
  dark-net:
    external: true
    name: dark-net
