services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dark
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dark_password}
      POSTGRES_DB: minter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dark -d minter"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minter-api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://dark:${DB_PASSWORD:-dark_password}@postgres:5432/minter
    restart: unless-stopped

  minter-worker:
    build: .
    command: ["python", "-m", "app.main_worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://dark:${DB_PASSWORD:-dark_password}@postgres:5432/minter
    restart: unless-stopped

volumes:
  postgres-data:
